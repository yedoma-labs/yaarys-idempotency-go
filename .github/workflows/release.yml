name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    # Release only when main has commits after the latest tag. A release commit that goes back to main, or a run with
    # no new work, must not publish again.
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          changed=true
          if [ -n "$last" ] && [ "$(git rev-list --count "$last..HEAD")" -eq 0 ]; then changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "latest tag: ${last:-none}, changes on main since: $changed"
  release:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install release tooling
        run: npm install --no-audit --no-fund

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
