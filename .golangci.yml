version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - gosec
  settings:
    gosec:
      excludes:
        # Tests use fixed fixtures and local listeners; these rules only add noise there.
        - G404
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-naming
        - name: receiver-naming
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - revive

formatters:
  enable:
    - gofmt
